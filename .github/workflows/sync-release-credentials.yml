name: Sync release app credentials

# On GitHub Free, organization secrets and variables reach public repositories
# only. This repository is public, so its workflows can read the organization's
# RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY secret; private
# repositories cannot. This workflow copies both into each private repository
# that runs release-please, as repository-level values under the same names.
# A private repository's release workflow then reads vars.RELEASE_APP_CLIENT_ID
# and secrets.RELEASE_APP_PRIVATE_KEY exactly as a public one would, and the
# copies can be deleted without touching any workflow if the organization ever
# moves to a plan that shares organization values with private repositories.
#
# A private repository is in scope when it is not archived and carries the
# repository topic "release-please". Topics come with the Metadata permission
# every GitHub App has, so the sync app needs no access to repository contents.
#
# This repository and its Actions logs are public. No step prints a private
# repository's name: every private name is masked before the first line of
# output, and the summary reports counts only. Keep it that way when editing.
# Client IDs are not secret and can appear in these logs.
#
# Writing secrets and variables needs a second GitHub App, the sync app, with
# only the repository permissions Secrets and Variables (read and write) plus
# the mandatory Metadata (read). No organization permissions: the
# organization's values arrive through the vars and secrets contexts below.
# Its client ID and private key live only in this repository (variable
# SYNC_APP_CLIENT_ID, secret SYNC_APP_PRIVATE_KEY), so the release app never
# holds permission to write secrets and the key handed to private repositories
# cannot rewrite them. Setup steps are in README.md.

on:
  schedule:
    # Daily, so a rotated release key reaches every repository within a day.
    # GitHub turns scheduled workflows off in a public repository after 60
    # days without activity; README.md says how to turn it back on.
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-release-credentials.yml

permissions: {}

concurrency:
  group: sync-release-credentials
  cancel-in-progress: false

jobs:
  sync:
    name: Copy credentials to private repositories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds nothing by default; GitHub creates it on the first run. Restrict it
    # to main and move SYNC_APP_PRIVATE_KEY into it to keep the sync key away
    # from workflows on other branches (README.md, "Hardening").
    environment: release-credentials
    steps:
      - name: Check that the credentials are available
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          SYNC_APP_CLIENT_ID: ${{ vars.SYNC_APP_CLIENT_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: |
          status=0
          for name in RELEASE_APP_CLIENT_ID RELEASE_APP_PRIVATE_KEY SYNC_APP_CLIENT_ID SYNC_APP_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=${name} is missing::${name} is not available to this workflow. See README.md, Setup."
              status=1
            fi
          done
          # A key whose line breaks became spaces or were removed, or that was
          # cut short, fails later with "DECODER routines::unsupported". Catch
          # it here and say why. The key is read the way
          # actions/create-github-app-token reads it: literal \n sequences turn
          # into line breaks first, so a key stored on one line with \n
          # escapes passes. openssl reads it from stdin; nothing is printed.
          for name in RELEASE_APP_PRIVATE_KEY SYNC_APP_PRIVATE_KEY; do
            key="${!name}"
            key="${key//\\n/$'\n'}"
            if [ -n "$key" ] && ! printf '%s\n' "$key" | openssl pkey -noout 2> /dev/null; then
              echo "::error title=${name} is not a usable private key::${name} does not parse as a PEM private key. Save the whole .pem file, BEGIN and END lines included, with its line breaks intact. See README.md, Setup."
              status=1
            fi
          done
          exit "$status"

      - name: Mint a sync app token
        id: sync-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # No permission-* inputs, on purpose. Without them the token carries
          # the sync app's installation permissions (Secrets and Variables
          # read and write, Metadata read). The action has no input for the
          # Variables permission, and naming any permission limits the token
          # to the ones named.

      - name: Copy credentials
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          OPT_IN_TOPIC: release-please
        run: |
          set -euo pipefail

          # One line per repository the sync app can reach: name, private, archived.
          repos="$(gh api --paginate /installation/repositories \
            --jq '.repositories[] | [.name, (.private | tostring), (.archived | tostring)] | @tsv')"

          # Mask every private repository's name before printing anything else.
          while IFS=$'\t' read -r name private archived; do
            if [ -n "$name" ] && [ "$private" = "true" ]; then
              echo "::add-mask::${name}"
              echo "::add-mask::${OWNER}/${name}"
            fi
          done <<< "$repos"

          synced=0
          skipped=0
          failed=0
          while IFS=$'\t' read -r name private archived; do
            [ -n "$name" ] || continue
            [ "$private" = "true" ] || continue
            [ "$archived" = "false" ] || continue

            # Topics need only the Metadata permission. A failed lookup counts
            # as a failure, never as "not in scope", so it cannot pass silently.
            if ! topics="$(gh api "repos/${OWNER}/${name}/topics" --jq '.names | join(",")' 2> /dev/null)"; then
              echo "::error::Could not read the topics of ${OWNER}/${name}."
              failed=$((failed + 1))
              continue
            fi
            if [[ ",${topics}," != *",${OPT_IN_TOPIC},"* ]]; then
              skipped=$((skipped + 1))
              continue
            fi

            if gh variable set RELEASE_APP_CLIENT_ID --repo "${OWNER}/${name}" --body "$RELEASE_APP_CLIENT_ID" > /dev/null \
              && printf '%s' "$RELEASE_APP_PRIVATE_KEY" | gh secret set RELEASE_APP_PRIVATE_KEY --repo "${OWNER}/${name}" > /dev/null; then
              synced=$((synced + 1))
            else
              # The name is masked, so this line reads "***" in the log.
              echo "::error::Could not write the release app credentials to ${OWNER}/${name}."
              failed=$((failed + 1))
            fi
          done <<< "$repos"

          echo "Copied the credentials to ${synced} private repositories. ${skipped} without the ${OPT_IN_TOPIC} topic. ${failed} failed."
          {
            echo "### Release app credentials"
            echo
            echo "| Copied | Without the topic | Failed |"
            echo "|---:|---:|---:|"
            echo "| ${synced} | ${skipped} | ${failed} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
