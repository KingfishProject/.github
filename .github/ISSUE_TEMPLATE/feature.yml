name: Feature
description: Something new a user can do or reach, such as a command, a page, an endpoint, or an option.
type: Feature
projects: ["KingfishProject/5"]
body:
  - type: markdown
    attributes:
      value: |
        In the sidebar, set **Priority** and **Effort**. When the work is due by a certain date, set that date as the **Deadline** and a **Target date** a little ahead of it, so there is some padding. Other work can have a Target date too. Fields need triage access; without it, leave them to a maintainer. A field missing from the sidebar can be added with **Add field** once the issue is created.

        In a public repository, leave out the names of private repositories, links into them, people's names, and anything under investigation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What someone can't do today, and who needs it."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to build. Leave it rough if the design is still open.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How anyone can tell it works.
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: "Issues or pull requests that have to land first, such as #12."
